<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingke Todo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { margin-bottom: 20px; color: #333; }
        .add-form { display: flex; gap: 8px; margin-bottom: 24px; }
        .add-form input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .add-form button { padding: 10px 20px; background: #4a90d9; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .todo-list { list-style: none; }
        .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: white; border-radius: 6px; margin-bottom: 8px; }
        .todo-item.completed .todo-title { text-decoration: line-through; color: #999; }
        .todo-title { flex: 1; }
        .btn { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-toggle { background: #e8f5e9; color: #2e7d32; }
        .btn-delete { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <h1>Lingke Todo</h1>

    <form class="add-form" action="/add" method="post">
        <input type="text" name="title" placeholder="What needs to be done?" required>
        <button type="submit">Add</button>
    </form>

    <ul class="todo-list">
        <li th:each="todo : ${todos}" th:classappend="${todo.completed} ? 'todo-item completed' : 'todo-item'">
            <span class="todo-title" th:text="${todo.title}"></span>
            <form th:action="@{/toggle/{id}(id=${todo.id})}" method="post" style="display:inline">
                <button class="btn btn-toggle" th:text="${todo.completed} ? 'Undo' : 'Done'">Done</button>
            </form>
            <form th:action="@{/delete/{id}(id=${todo.id})}" method="post" style="display:inline">
                <button class="btn btn-delete">Delete</button>
            </form>
        </li>
    </ul>
</body>
</html>
