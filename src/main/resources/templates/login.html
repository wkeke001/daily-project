<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Lingke Todo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 380px; }
        .login-card h2 { text-align: center; margin-bottom: 24px; color: #333; font-size: 22px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #4a90d9; }
        .btn-login { width: 100%; padding: 12px; background: #4a90d9; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: #3a7bc8; }
        .msg-error { background: #ffebee; color: #c62828; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
        .msg-success { background: #e8f5e9; color: #2e7d32; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
        .link-row { text-align: center; margin-top: 16px; font-size: 13px; }
        .link-row a { color: #4a90d9; text-decoration: none; }
        .link-row a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .login-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Lingke Todo</h2>
        <div class="msg-error" th:if="${param.error}">用户名或密码错误</div>
        <div class="msg-success" th:if="${param.registered}">注册成功，请登录</div>
        <div class="msg-success" th:if="${param.logout}">已退出登录</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">登录</button>
        </form>
        <div class="link-row">
            没有账号？<a th:href="@{/register}">注册</a>
        </div>
        <div style="text-align:center;margin-top:12px;">
            <button type="button" onclick="testLogin()" style="padding:6px 14px;background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9;border-radius:4px;cursor:pointer;font-size:12px;">测试登录</button>
        </div>
    </div>
    <script>
    function testLogin() {
        document.querySelector('input[name=username]').value = 'wangke';
        document.querySelector('input[name=password]').value = 'wangke';
        document.querySelector('form').submit();
    }
    </script>
</body>
</html>
